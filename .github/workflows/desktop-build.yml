name: Desktop Build

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "package.json"
      - "desktop/**"
      - "src/**"
      - "index.html"
      - "styles.css"
      - "profiles/**"
      - ".github/workflows/desktop-build.yml"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Static JS/JSON checks
        shell: pwsh
        run: |
          Get-ChildItem src -Filter *.js | ForEach-Object { node --check $_.FullName }
          Get-ChildItem desktop -Filter *.cjs | ForEach-Object { node --check $_.FullName }
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('profiles/jipbap_v2.example.json','utf8'));"
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: ToonDesk-windows
          path: dist/*.exe
          retention-days: 30


  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ToonDesk-windows
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
