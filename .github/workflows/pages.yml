name: Web Live Sync

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "styles.css"
      - "src/**"
      - "profiles/**"
      - "manifest.webmanifest"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-live-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Static JS/JSON checks
        run: |
          set -euo pipefail
          for f in src/*.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('profiles/jipbap_v2.example.json','utf8'));"
      - name: Publish main to gh-pages
        run: |
          set -euo pipefail
          git push origin HEAD:gh-pages --force
